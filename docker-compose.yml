services:

  # ── Database ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── API ───────────────────────────────────────────────────────────────────────
  # Domain: configure in Coolify UI (e.g. api.your-domain.com → port 3000)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECRET: ${COOKIE_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ADMIN_CORS_ORIGIN: ${ADMIN_CORS_ORIGIN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://api:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Admin panel ──────────────────────────────────────────────────────────────
  # Domain: configure in Coolify UI (e.g. admin.your-domain.com → port 80)
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

  # ── Web (mobile PWA) ─────────────────────────────────────────────────────────
  # Domain: configure in Coolify UI (e.g. app.your-domain.com → port 80)
  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

networks:
  # Traefik-facing — Coolify attaches its proxy to containers on this network
  frontend:
    driver: bridge

  # Isolated — only api ↔ postgres; no internet or host access
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    driver: local
